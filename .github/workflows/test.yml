name: Test

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 15 * * 5'

jobs:
  docker:
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:sid
          - debian:trixie
          - ubuntu:noble
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{matrix.runner}}
    steps:
    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v5
      with:
        build-args:
          IMAGE=${{matrix.image}}
